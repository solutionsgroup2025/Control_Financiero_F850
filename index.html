<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Familia 850 — Panel de Control Financiero</title>
  
  <!-- Carga de Supabase via CDN oficial -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 20px;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.5rem;
      color: var(--text-main);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .card-title {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-value {
      font-size: 1.875rem;
      font-weight: bold;
    }

    .card-value.green { color: var(--accent-green); }
    .card-value.red { color: var(--accent-red); }
    .card-value.blue { color: var(--accent-blue); }

    .form-section {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    input, select, button {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-blue);
    }

    button {
      background-color: var(--accent-blue);
      color: white;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--bg-secondary);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Familia 850 — Panel de Control Financiero</h1>
      <div id="status-indicator" style="color: var(--accent-green); font-size: 0.875rem;">● Conectado</div>
    </header>

    <main class="main">
      <div class="page" id="dashboard">
        <!-- Tarjetas de resumen -->
        <div class="dashboard-grid">
          <div class="card">
            <div class="card-title">Ingresos Totales</div>
            <div class="card-value green" id="total-ingresos">$0.00</div>
          </div>
          <div class="card">
            <div class="card-title">Gastos Totales</div>
            <div class="card-value red" id="total-gastos">$0.00</div>
          </div>
          <div class="card">
            <div class="card-title">Balance Neto</div>
            <div class="card-value blue" id="balance-neto">$0.00</div>
          </div>
        </div>

        <!-- Formulario de ingreso de transacciones -->
        <div class="form-section">
          <h2 style="font-size: 1.1rem; margin-bottom: 16px;">Registrar Movimiento</h2>
          <form id="transaction-form" class="form-group">
            <input type="date" id="tx-date" required>
            <input type="text" id="tx-description" placeholder="Descripción" required style="flex: 1; min-width: 180px;">
            <select id="tx-type" required>
              <option value="gasto">Gasto</option>
              <option value="ingreso">Ingreso</option>
            </select>
            <input type="number" id="tx-amount" step="0.01" placeholder="Monto ($)" required style="width: 120px;">
            <button type="submit">Guardar Movimiento</button>
          </form>
        </div>

        <!-- Tabla de movimientos -->
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Descripción</th>
                <th>Tipo</th>
                <th>Monto</th>
              </tr>
            </thead>
            <tbody id="transactions-body">
              <!-- Las transacciones se renderizan aquí dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Configuración de Supabase -->
  <script>
    // -----------------------------------------------------------------
    // COLOCA TUS CREDENCIALES DE SUPABASE AQUÍ ABAJO
    // -----------------------------------------------------------------
    const SUPABASE_URL = 'https://xmxmnbdmxltmccgrsnjc.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'sb_publishable_I6Q5E1VcOnU0sMhwAohxsQ_u6B1JzfK';

    // Inicializar el cliente de Supabase
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Lógica básica del dashboard
    document.addEventListener('DOMContentLoaded', () => {
      // Establecer la fecha de hoy por defecto en el input
      document.getElementById('tx-date').valueAsDate = new Date();

      // Cargar transacciones iniciales
      fetchTransactions();

      // Evento de envío del formulario
      document.getElementById('transaction-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const date = document.getElementById('tx-date').value;
        const description = document.getElementById('tx-description').value;
        const type = document.getElementById('tx-type').value;
        const amount = parseFloat(document.getElementById('tx-amount').value);

        const { data, error } = await _supabase
          .from('transactions')
          .insert([{ date, description, type, amount }]);

        if (error) {
          console.error('Error al insertar:', error);
          alert('Hubo un error al guardar los datos.');
        } else {
          document.getElementById('tx-description').value = '';
          document.getElementById('tx-amount').value = '';
          fetchTransactions();
        }
      });
    });

    async function fetchTransactions() {
      const { data: transactions, error } = await _supabase
        .from('transactions')
        .select('*')
        .order('date', { ascending: false });

      if (error) {
        console.error('Error al obtener datos:', error);
        return;
      }

      renderTable(transactions || []);
      updateTotals(transactions || []);
    }

    function renderTable(transactions) {
      const tbody = document.getElementById('transactions-body');
      tbody.innerHTML = '';

      transactions.forEach(tx => {
        const tr = document.createElement('tr');
        const isGasto = tx.type === 'gasto';
        tr.innerHTML = `
          <td>${tx.date}</td>
          <td>${tx.description}</td>
          <td style="color: ${isGasto ? 'var(--accent-red)' : 'var(--accent-green)'}">${tx.type}</td>
          <td style="font-weight: bold; color: ${isGasto ? 'var(--accent-red)' : 'var(--accent-green)'}">
            ${isGasto ? '-' : '+'}$${parseFloat(tx.amount).toFixed(2)}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateTotals(transactions) {
      let ingresos = 0;
      let gastos = 0;

      transactions.forEach(tx => {
        if (tx.type === 'ingreso') ingresos += parseFloat(tx.amount);
        if (tx.type === 'gasto') gastos += parseFloat(tx.amount);
      });

      const balance = ingresos - gastos;

      document.getElementById('total-ingresos').textContent = `$${ingresos.toFixed(2)}`;
      document.getElementById('total-gastos').textContent = `$${gastos.toFixed(2)}`;
      document.getElementById('balance-neto').textContent = `$${balance.toFixed(2)}`;
    }
  </script>
</body>
</html>
